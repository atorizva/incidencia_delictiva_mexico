name: Python CI/CD

on:
  push:
    branches:
      - "main"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches:
      - "main"

concurrency:
  group: python-cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-setup-uv@v7
        with:
          enable-cache ${{ !env.ACT }}  # If not locally run with 'act', enable cache

      - name: Sync project
        run: uv sync --locked --all-extras --dev

      - name: Run tests
        run: uv run pytest

      - name: Upload test results
        uses: actions/upload-artifact@v5
        with:
          name: pytest-results
          path: |
            test_report.xml
            coverage.xml

      - name: Test report
        uses: dorny/test-reporter@v2
        if: ${{ !cancelled() }}
        with:
          name: Pytest tests results
          path: test_report.xml
          reporter: java-junit
