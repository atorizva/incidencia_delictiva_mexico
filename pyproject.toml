[project]
name = "etl"
version = "0.1.0"
description = "ETL para visualización y análisis de incidiencia delictiva en México."
authors = [
    { name = "atorizva" }
]
requires-python = ">=3.14"
dependencies = [
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
]

[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "pytest-mock>=3.15.1",
]
